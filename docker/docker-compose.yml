version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: solve-log-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: solve_log_db
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: solve-log-app
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: solve_log_db
      MYSQL_USER: root
      MYSQL_PASSWORD: password
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
